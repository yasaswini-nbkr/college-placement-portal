<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Resume | Placement Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        nav {
            background: #111827;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 70px auto;
        }

        .card {
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .file-box {
            border: 2px dashed #9ca3af;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .current {
            margin-top: 25px;
            padding: 15px;
            background: #f0fdf4;
            border-radius: 10px;
            color: #166534;
        }

        @media (max-width: 700px) {
            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Placement Portal</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/dashboard/">Dashboard</a>
        <a href="/jobs/">Jobs</a>
        <a href="/applications/">My Applications</a>
        <a href="/logout/">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="card">

        <div class="icon">📄</div>

        <h1>Upload Your Resume</h1>

        <p class="subtitle">
            Upload your latest resume for placement opportunities.
        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="file-box">
                <input
                    type="file"
                    name="resume"
                    accept=".pdf,.doc,.docx"
                    required
                >
            </div>

            <button type="submit">
                Upload Resume
            </button>

        </form>

        {% if student.resume %}
            <div class="current">
                ✅ Resume already uploaded
            </div>
        {% endif %}

        <a href="{% url 'dashboard' %}" class="back">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
